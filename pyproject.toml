[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcraft"
dynamic = ["version"]
description = "Bitcoin transaction intelligence in your terminal: ranked alerts, evidence and link analysis."
readme = "packages/PYPI_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Rohan Pattanayak" },
    { name = "Jagadish Pattnaik" },
    { name = "Shreya Mishra" },
    { name = "Shreya Mohanty" },
    { name = "Ashutosh Badapada" },
    { name = "Rosalin Nayak" },
]
keywords = ["bitcoin", "aml", "fraud-detection", "graph", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "textual>=5.0",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23"]

[project.scripts]
bitcraft = "bitcraft.cli:main"

[project.urls]
Homepage = "https://github.com/RohanOnKeys/bitcraft"
Source = "https://github.com/RohanOnKeys/bitcraft"
Documentation = "https://github.com/RohanOnKeys/bitcraft/blob/main/docs/user_manual.md"
Issues = "https://github.com/RohanOnKeys/bitcraft/issues"

[tool.setuptools.dynamic]
version = { attr = "bitcraft.__version__" }

[tool.setuptools.packages.find]
include = ["bitcraft*"]

[tool.setuptools.package-data]
bitcraft = ["theme.tcss", "assets/mascots/*.png"]
