# BitCraft ML pipeline configuration.
# See plans/plan.md sections 6.2 and 7 for the source values, and
# docs/model_card.md for why a supervised risk model leads the fusion.

# Labels with timestep <= this are "known history": they train the risk
# model and feed community illicit ratios. Later timesteps are the holdout
# that precision@k is reported on.
label_window:
  train_max_timestep: 34

risk_model:
  type: hist_gradient_boosting
  max_iter: 300
  learning_rate: 0.08
  max_leaf_nodes: 31
  cv_folds: 5
  random_state: 42

isolation_forest:
  n_estimators: 300
  max_samples: "auto"
  contamination: 0.022

score_fusion:
  risk_model_weight: 0.65
  anomaly_score_weight: 0.05
  community_illicit_ratio_weight: 0.20
  network_ip_signal_weight: 0.10

explainability:
  top_n_shap: 100
